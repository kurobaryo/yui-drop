<!doctype html>
<html lang="en" data-theme="dark" data-mode="dark" data-template="linear" data-accent="sky">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d12" />
    <!-- We intentionally ship no analytics / telemetry / external trackers. -->
    <!-- Google Fonts: Inter (sans), Instrument Serif (display), JetBrains Mono (OTP). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Yui-Drop</title>
    <script>
      // Restore the visitor's appearance choice before first paint to avoid a
      // flash. Only light/dark is restored here: the *template* and *accent*
      // are server-owned (admin setting) and arrive with /api/config a moment
      // later, at which point the theme store re-applies all three attributes.
      // The `data-template`/`data-accent` values in the <html> tag above are
      // the built-in defaults and act as the pre-hydration fallback.
      try {
        const t = localStorage.getItem('yui-drop:theme');
        const root = document.documentElement;
        let resolved = null;
        if (t === 'light' || t === 'dark') {
          resolved = t;
        } else if (t === 'auto' || !t) {
          const mql = window.matchMedia('(prefers-color-scheme: light)');
          resolved = mql.matches ? 'light' : 'dark';
        }
        if (resolved) {
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-mode', resolved);
        }
      } catch (_) { /* localStorage may be unavailable */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
