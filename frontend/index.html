<!doctype html>
<html lang="en" data-theme="dark" data-mode="dark" data-template="linear" data-accent="sky">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d12" />
    <!-- We intentionally ship no analytics / telemetry / external trackers. -->
    <!-- Google Fonts: Inter (sans), Instrument Serif (display), JetBrains Mono (OTP). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Yui-Drop</title>
    <script>
      (function () {
        // Restore the visitor's appearance before first paint to avoid a flash.
        // The *template* and *accent* are server-owned (admin setting) and
        // arrive with /api/config a moment later, at which point the theme store
        // re-applies all three attributes. Until then we use the ones the server
        // sent on the previous visit, falling back to the built-in defaults in
        // the <html> tag above.
        const root = document.documentElement;

        // One-time reset: the old header toggle stored light/dark permanently,
        // so those visitors never followed the system again. Clear that choice
        // once; the current toggle stores `auto` when it matches the system.
        try {
          if (localStorage.getItem('yui-drop:mode-reset') !== '1') {
            localStorage.removeItem('yui-drop:theme');
            localStorage.setItem('yui-drop:mode-reset', '1');
          }
        } catch (_) { /* localStorage may be unavailable */ }

        try {
          const t = localStorage.getItem('yui-drop:theme');
          let resolved = null;
          if (t === 'light' || t === 'dark') {
            resolved = t;
          } else if (t === 'auto' || !t) {
            const mql = window.matchMedia('(prefers-color-scheme: light)');
            resolved = mql.matches ? 'light' : 'dark';
          }
          if (resolved) {
            root.setAttribute('data-theme', resolved);
            root.setAttribute('data-mode', resolved);
            root.style.colorScheme = resolved;
          }
        } catch (_) { /* localStorage may be unavailable */ }

        // Template + accent from the last /api/config (written by the theme
        // store), so a porcelain site doesn't flash Linear's colours.
        try {
          const last = JSON.parse(localStorage.getItem('yui-drop:last-theme') || 'null');
          if (
            last &&
            typeof last.template === 'string' &&
            typeof last.accent === 'string' &&
            /^(linear|apple|porcelain)$/.test(last.template) &&
            /^[a-z0-9-]{1,24}$/.test(last.accent)
          ) {
            root.setAttribute('data-template', last.template);
            root.setAttribute('data-accent', last.accent);
          }
        } catch (_) { /* unavailable storage or a corrupt entry */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
